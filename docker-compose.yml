# The backend mounts the Docker socket, so anyone who can reach its port has
# root on this machine. Two things keep that contained:
#
# 1. Both services publish on 127.0.0.1 only, so nothing is on the LAN by
#    default. To deliberately expose them, set DOCKLITE_BIND_ADDRESS=0.0.0.0.
# 2. The backend must bind 0.0.0.0 *inside* its container to be reachable
#    through the published port at all. That counts as off-loopback, so login
#    is enforced and DockLite refuses to start while the built-in admin/admin
#    password is active. Set DOCKLITE_ADMIN_PASSWORD before the first boot:
#
#      DOCKLITE_ADMIN_PASSWORD=... docker compose up
#
#    It is read only when the admin is seeded; delete server/data/auth-config.json
#    to re-seed an existing install, or change the password under Settings.
services:
  backend:
    image: node:24-alpine
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install && pnpm server:dev"
    environment:
      DOCKLITE_DOCKER_SOCKET: /var/run/docker.sock
      # Container-internal bind; host-side exposure is the ports entry below.
      DOCKLITE_HOST: 0.0.0.0
      DOCKLITE_PORT: 9001
      DOCKLITE_ADMIN_USERNAME: ${DOCKLITE_ADMIN_USERNAME:-admin}
      DOCKLITE_ADMIN_PASSWORD: ${DOCKLITE_ADMIN_PASSWORD:-}
    ports:
      - "${DOCKLITE_BIND_ADDRESS:-127.0.0.1}:${DOCKLITE_BACKEND_PORT:-9001}:9001"
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 8080"
    ports:
      - "${DOCKLITE_BIND_ADDRESS:-127.0.0.1}:${DOCKLITE_FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
